name: Deploy Episodes

on:
  push:
    tags:
      - "episode-*"

  workflow_dispatch:

  delete:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    if: >
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'delete' &&
        github.event.ref_type == 'tag' &&
        startsWith(github.event.ref, 'episode-')
      )

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          rm -rf _site
          mkdir -p _site

          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>okoze Live Demo</title>
          </head>
          <body>
            <h1>okoze Live Demo</h1>
            <h2>Episodes</h2>
            <ul>
          EOF

          declare -A seen_episodes

          for tag in $(git tag -l 'episode-*' --sort=refname); do
            if [[ "$tag" =~ ^episode-([0-9]+)(-fix[1-9A-Za-z])?$ ]]; then
              episode="${BASH_REMATCH[1]}"
            else
              echo "Skipping invalid episode tag: ${tag}"
              continue
            fi

            echo "Deploying ${tag} -> episode-${episode}/"

            # Later fixes overwrite earlier versions of the same episode.
            rm -rf "_site/episode-${episode}"
            mkdir -p "_site/episode-${episode}"

            git archive "$tag" \
              index.html main.js style.css \
              | tar -x -C "_site/episode-${episode}"

            # Add each episode to the site index only once.
            if [[ -z "${seen_episodes[$episode]+x}" ]]; then
              echo "              <li><a href=\"./episode-${episode}/\">Episode ${episode}</a></li>" \
                >> _site/index.html
              seen_episodes[$episode]=1
            fi
          done

          cat >> _site/index.html <<'EOF'
            </ul>
          </body>
          </html>
          EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        uses: actions/deploy-pages@v4
